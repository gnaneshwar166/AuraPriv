services:
  # Option A: Fullstack Web Service (Recommended - runs API + WebSockets + serves React frontend)
  - type: web
    name: aurapriv
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
